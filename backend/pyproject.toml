[project]
name = "smartgaz"
version = "0.1.0"
description = "SmartGaz — suyultirilgan gaz balonlari ta'minoti: navbat, antifrod, GPS monitoring"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
